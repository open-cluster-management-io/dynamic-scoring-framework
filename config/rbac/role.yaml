---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - cluster.open-cluster-management.io
  resources:
  - managedclusters
  verbs:
  - list
- apiGroups:
  - work.open-cluster-management.io
  resources:
  - manifestworks
  verbs:
  - create
- apiGroups:
  - work.open-cluster-management.io
  resourceNames:
  - dynamic-scoring-config-manifestwork
  resources:
  - manifestworks
  verbs:
  - delete
  - get
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manager-role
  namespace: system
rules:
- apiGroups:
  - dynamic-scoring.open-cluster-management.io
  resources:
  - dynamicscorers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - dynamic-scoring.open-cluster-management.io
  resources:
  - dynamicscorers/status
  verbs:
  - get
  - update
- apiGroups:
  - dynamic-scoring.open-cluster-management.io
  resources:
  - dynamicscoringconfigs
  verbs:
  - get
  - list
  - update
  - watch
- apiGroups:
  - dynamic-scoring.open-cluster-management.io
  resources:
  - dynamicscoringconfigs/finalizers
  verbs:
  - update
