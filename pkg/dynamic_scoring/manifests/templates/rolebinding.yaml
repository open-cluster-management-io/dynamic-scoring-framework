kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: dynamic-scoring-agent
  namespace: {{ .AddonInstallNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dynamic-scoring-agent
subjects:
  - kind: ServiceAccount
    name: dynamic-scoring-agent-sa
    namespace: {{ .AddonInstallNamespace }}
