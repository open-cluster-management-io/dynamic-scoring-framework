kind: Deployment
apiVersion: apps/v1
metadata:
  name: dynamic-scoring-addon-controller
  labels:
    app: dynamic-scoring-addon-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamic-scoring-addon-controller
  template:
    metadata:
      labels:
        app: dynamic-scoring-addon-controller
    spec:
      serviceAccountName: dynamic-scoring-addon-sa
      hostIPC: false
      hostNetwork: false
      hostPID: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: dynamic-scoring-addon-controller
        image: quay.io/open-cluster-management/dynamic-scoring-addon
        imagePullPolicy: IfNotPresent
        args:
          - "/dynamic-scoring-addon"
          - "controller"
        env:
          - name: DYNAMIC_SCORING_ADDON_IMAGE
            value: $(IMG_ADDON)
          - name: DYNAMIC_SCORING_ADDON_IMAGE_PULL_SECRETS
            value: '["open-cluster-management-image-pull-credentials","hub-registry-secret"]'
          - name: DYNAMIC_SCORING_ADDON_NAMESPACE
            value: dynamic-scoring
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        volumeMounts:
          - mountPath: /tmp
            name: tmp
      volumes:
        - name: tmp
          emptyDir: {}
