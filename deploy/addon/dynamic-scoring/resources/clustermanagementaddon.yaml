apiVersion: addon.open-cluster-management.io/v1beta1
kind: ClusterManagementAddOn
metadata:
  name: dynamic-scoring-framework
spec:
  addOnMeta:
    displayName: dynamic-scoring-framework
    description: "dynamic-scoring-framework addon for Open Cluster Management"
  installStrategy:
    type: Placements
    placements:
      - name: global
        namespace: open-cluster-management
        configs:
          - group: addon.open-cluster-management.io
            resource: addondeploymentconfigs
            name: dynamic-scoring-addon-config
            namespace: open-cluster-management
      - name: global-aarch64
        namespace: open-cluster-management
        configs:
          - group: addon.open-cluster-management.io
            resource: addondeploymentconfigs
            name: dynamic-scoring-addon-config-aarch64
            namespace: open-cluster-management
