name: ImagePostsubmit

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Serialize the entire publisher so mutable child tags cannot mix across runs.
concurrency:
  group: image-postsubmit-main
  cancel-in-progress: false

jobs:
  images:
    name: images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
        image: [controller, addon]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Log in to Quay
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login quay.io --username "${{ secrets.DOCKER_USER }}" --password-stdin
      - name: Build image
        env:
          IMAGE_BUILD_EXTRA_FLAGS: --platform linux/${{ matrix.arch }} --build-arg OS=linux --build-arg ARCH=${{ matrix.arch }}
          IMAGE_TAG: latest-${{ matrix.arch }}
        run: make docker-build-${{ matrix.image }}
      - name: Push image
        env:
          IMAGE_TAG: latest-${{ matrix.arch }}
        run: |
          main_ref=$(git ls-remote --exit-code origin refs/heads/main)
          main_sha=${main_ref%%[[:space:]]*}
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "Skip old run: $GITHUB_SHA is no longer origin/main ($main_sha)"
            exit 0
          fi
          make docker-push-${{ matrix.image }}

  image-manifest:
    name: image manifest
    runs-on: ubuntu-latest
    needs: [images]
    strategy:
      matrix:
        image: [controller, addon]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Log in to Quay
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login quay.io --username "${{ secrets.DOCKER_USER }}" --password-stdin
      - name: Create and push manifest
        env:
          IMAGE_TAG: latest
        run: |
          main_ref=$(git ls-remote --exit-code origin refs/heads/main)
          main_sha=${main_ref%%[[:space:]]*}
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "Skip old run: $GITHUB_SHA is no longer origin/main ($main_sha)"
            exit 0
          fi
          make image-manifest-${{ matrix.image }}
