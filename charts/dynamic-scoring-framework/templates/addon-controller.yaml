kind: Deployment
apiVersion: apps/v1
metadata:
  name: dynamic-scoring-addon-controller
  namespace: {{ .Values.hubSetting.namespace }}
  labels:
    app: dynamic-scoring-addon-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamic-scoring-addon-controller
  template:
    metadata:
      labels:
        app: dynamic-scoring-addon-controller
    spec:
      serviceAccountName: dynamic-scoring-addon-sa
      containers:
      - name: dynamic-scoring-addon-controller
        image: "{{ .Values.hubSetting.addonController.image.name }}:{{ .Values.hubSetting.addonController.image.tag }}"
        imagePullPolicy: {{ .Values.hubSetting.addonController.image.pullPolicy }}
        args:
          - "/dynamic-scoring-addon"
          - "controller"
        env:
          - name: DYNAMIC_SCORING_ADDON_IMAGE
            value: "{{ .Values.spokeSetting.agent.image.name }}:{{ .Values.spokeSetting.agent.image.tag }}"
          - name: DYNAMIC_SCORING_ADDON_IMAGE_PULL_SECRETS
            value: {{ .Values.spokeSetting.agent.imagePullSecrets | toJson | quote }}
          - name: DYNAMIC_SCORING_ADDON_NAMESPACE
            value: {{ .Values.spokeSetting.namespace | quote }}
{{- with .Values.hubSetting.proxy }}
{{- with .httpProxy }}
          - name: HTTP_PROXY
            value: {{ . | quote }}
{{- end }}
{{- with .httpsProxy }}
          - name: HTTPS_PROXY
            value: {{ . | quote }}
{{- end }}
{{- with .noProxy }}
          - name: NO_PROXY
            value: {{ . | quote }}
{{- end }}
{{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        volumeMounts:
          - mountPath: /tmp
            name: tmp
{{- with .Values.hubSetting.extraVolumeMounts }}
{{ toYaml . | nindent 10 }}
{{- end }}
      hostIPC: false
      hostNetwork: false
      hostPID: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
{{- with .Values.hubSetting.affinity }}
      affinity:
{{ toYaml . | nindent 8 }}
{{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- with .Values.hubSetting.extraVolumes }}
{{ toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.hubSetting.imagePullSecrets }}
      imagePullSecrets:
{{- range . }}
        - name: {{ . | quote }}
{{- end }}
{{- end }}
{{- with .Values.hubSetting.nodeSelector }}
      nodeSelector:
{{ toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.hubSetting.tolerations }}
      tolerations:
{{ toYaml . | nindent 8 }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dynamic-scoring-addon-sa
  namespace: {{ .Values.hubSetting.namespace }}
